[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tractography"]

[project]
name = "tractography"
authors = [
	{name = "Samuel Deslauriers-Gauthier", email = "samuel.deslauriers-gauthier@inria.fr"},
	{name = "Romain Veltz", email = "romain.veltz@inria.fr"},
]
version = "0.2.3"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
	"numpy>=2.0",
    "nibabel~=5.3",
    "scipy>=1.15",
    "pyopencl>=2024",
    "siphash24~=1.7",
	"nimesh@git+https://gitlab.inria.fr/cronos/software/nimesh",
    "nimesh>=0.0.2",
    "pydantic~=2.10",
	"trimesh>=4.7",
]

[project.scripts]
tractography = "tractography.cli:main"
