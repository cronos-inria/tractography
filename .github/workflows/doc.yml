name: Build and deploy Documentation

on:
  push:
    branches: [ feature/doc ]
  pull_request:
    branches: [ feature/doc ]
  workflow_dispatch:  # permit manual launch
permissions:
  contents: write # for gh-deploy
  # pages: write  # not needed when using mkdocs gh-deploy
  # id-token: write  # not needed when using mkdocs gh-deploy

jobs:
  build_mkdocs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.62.2
          cache: true
      - name: Build docs
        run: pixi run doc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # required for gh-deploy
