name: doc

on:
  push:
    branches: [ feature/doc ]
  pull_request:
    branches: [ feature/doc ]
  workflow_dispatch:  # permit manual launch

jobs:
  deploy-docs:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.62.2
          cache: true
     
      - name: Test mkdocs
        run: pixi run testdoc

      - name: Deploy docs
        run: pixi run doc