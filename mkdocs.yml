site_name: tractography
site_description: Project documentation.
site_author: Inria Cronos

repo_url: https://github.com/cronos-inria/tractography
repo_name: GitHub

theme: 
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  locale: en
  highlightjs: true
  hljs_languages: python

nav:
    - Home: index.md
    - Getting Started: getting_started.md
    - User Guide: user-guide/user_guide.md
    - About: 
        - about/release-notes.md
        - about/contributing.md
        - about/licence.md
        - about/related-software.md
    - GitHub: https://github.com/cronos-inria/tractography

extra_css:
    - css/style.css

markdown_extensions:
  - admonition